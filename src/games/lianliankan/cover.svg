<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" shapeRendering="crispEdges" role="img" aria-label="Lianliankan cover">
  <!-- 封面缩略图：星露谷式像素风（决策 #26）；色板出处 lianliankan/DESIGN.md §4 -->
  <rect x="0" y="0" width="96" height="64" fill="#8ecbeb"/>
  <!-- 云朵 -->
  <g fill="#fdfefe">
    <rect x="6" y="8" width="16" height="4"/><rect x="10" y="4" width="8" height="4"/>
    <rect x="64" y="10" width="12" height="4"/><rect x="68" y="6" width="8" height="4"/>
  </g>
  <!-- 草地 -->
  <rect x="0" y="48" width="96" height="16" fill="#7fb069"/>
  <g fill="#5f8a4e">
    <rect x="4" y="52" width="4" height="4"/><rect x="16" y="56" width="4" height="4"/><rect x="28" y="52" width="4" height="4"/>
    <rect x="40" y="56" width="4" height="4"/><rect x="56" y="52" width="4" height="4"/><rect x="68" y="56" width="4" height="4"/>
    <rect x="84" y="52" width="4" height="4"/>
  </g>
  <!-- 连接线（两拐，黄） -->
  <g fill="#ffd83d">
    <rect x="48" y="22" width="4" height="4"/><rect x="52" y="22" width="4" height="4"/><rect x="56" y="22" width="4" height="4"/><rect x="60" y="22" width="4" height="4"/>
    <rect x="60" y="26" width="4" height="4"/><rect x="60" y="30" width="4" height="4"/><rect x="60" y="34" width="4" height="4"/>
    <rect x="64" y="34" width="4" height="4"/><rect x="68" y="34" width="4" height="4"/><rect x="72" y="34" width="4" height="4"/>
  </g>
  <!-- 圆形方块（红，带脸） -->
  <g fill="#5a2e24"><rect x="20" y="20" width="4" height="4"/><rect x="28" y="20" width="4" height="4"/><rect x="20" y="28" width="4" height="4"/><rect x="28" y="28" width="4" height="4"/><rect x="16" y="24" width="4" height="4"/><rect x="32" y="24" width="4" height="4"/><rect x="24" y="16" width="4" height="4"/><rect x="24" y="32" width="4" height="4"/></g>
  <g fill="#e05b4d"><rect x="24" y="20" width="4" height="4"/><rect x="24" y="24" width="4" height="4"/><rect x="24" y="28" width="4" height="4"/><rect x="20" y="24" width="4" height="4"/><rect x="28" y="24" width="4" height="4"/></g>
  <!-- 眼睛 + 腮红 + 嘴 -->
  <g fill="#3a2418"><rect x="20" y="22" width="4" height="4"/><rect x="28" y="22" width="4" height="4"/><rect x="22" y="28" width="4" height="4"/><rect x="26" y="28" width="4" height="4"/></g>
  <g fill="#f2a3c4"><rect x="16" y="26" width="4" height="4"/><rect x="32" y="26" width="4" height="4"/></g>
  <!-- 星形方块（黄） -->
  <g fill="#b8871a"><rect x="68" y="12" width="4" height="4"/><rect x="64" y="16" width="4" height="4"/><rect x="76" y="16" width="4" height="4"/><rect x="60" y="20" width="4" height="4"/><rect x="80" y="20" width="4" height="4"/><rect x="68" y="24" width="4" height="4"/><rect x="72" y="24" width="4" height="4"/></g>
  <g fill="#e0a33c"><rect x="68" y="16" width="4" height="4"/><rect x="72" y="16" width="4" height="4"/><rect x="64" y="20" width="4" height="4"/><rect x="68" y="20" width="4" height="4"/><rect x="72" y="20" width="4" height="4"/><rect x="76" y="20" width="4" height="4"/></g>
  <!-- 星尘 -->
  <g fill="#fdfefe"><rect x="88" y="6" width="4" height="4"/><rect x="8" y="40" width="4" height="4"/><rect x="40" y="10" width="4" height="4"/></g>
</svg>
