  </g>
  <text x="12" y="22" font-family="monospace, sans-serif" font-size="16" font-weight="bold" fill="#e62429">MCS</text>
  <text x="12" y="36" font-family="monospace, sans-serif" font-size="8" font-weight="bold" fill="#1c1b1b">MINECOUNTER-STRIKE</text>
