    <rect x="44" y="98" width="4" height="12" fill="#a31217" stroke="#1c1b1b" stroke-width="2"/>
    <rect x="27" y="84" width="4" height="12" fill="#a31217" stroke="#1c1b1b" stroke-width="2"/>
    <rect x="47" y="84" width="4" height="12" fill="#a31217" stroke="#1c1b1b" stroke-width="2"/>
  </g>
  <!-- 准星 -->
