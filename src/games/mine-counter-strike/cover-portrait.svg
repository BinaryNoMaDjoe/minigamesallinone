<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" shapeRendering="crispEdges" role="img" aria-label="MINECOUNTER-STRIKE">
  <rect width="240" height="360" fill="#1c1b1b"/>
  <rect y="0" width="240" height="220" fill="#a9d8e8"/>
  <rect y="220" width="240" height="140" fill="#5f6a68"/>
  <g stroke="#3a3f3d" stroke-width="2">
    <line x1="0" y1="220" x2="240" y2="220"/>
    <line x1="0" y1="290" x2="240" y2="290"/>
    <line x1="80" y1="220" x2="80" y2="360"/>
