  </g>
  <!-- 方块士兵（红）居中 -->
  <g>
    <rect x="88" y="140" width="28" height="28" fill="#e62429" stroke="#1c1b1b" stroke-width="3"/>
    <rect x="96" y="150" width="6" height="6" fill="#ffffff"/>
    <rect x="108" y="150" width="6" height="6" fill="#ffffff"/>
    <rect x="92" y="168" width="20" height="24" fill="#e62429" stroke="#1c1b1b" stroke-width="3"/>
    <rect x="88" y="192" width="6" height="20" fill="#a31217" stroke="#1c1b1b" stroke-width="3"/>
    <rect x="112" y="192" width="6" height="20" fill="#a31217" stroke="#1c1b1b" stroke-width="3"/>
    <rect x="82" y="168" width="6" height="20" fill="#a31217" stroke="#1c1b1b" stroke-width="3"/>
    <rect x="118" y="168" width="6" height="20" fill="#a31217" stroke="#1c1b1b" stroke-width="3"/>
  </g>
  <!-- 准星 -->
  <g stroke="#ffffff" stroke-width="5">
    <line x1="120" y1="232" x2="120" y2="246"/>
    <line x1="120" y1="266" x2="120" y2="280"/>
    <line x1="80" y1="256" x2="94" y2="256"/>
    <line x1="108" y1="256" x2="120" y2="256"/>
    <line x1="146" y1="256" x2="160" y2="256"/>
  </g>
  <rect x="118" y="253" width="4" height="6" fill="#e62429"/>
