  <g>
    <rect x="120" y="310" width="64" height="10" fill="#4a4a4a" stroke="#1c1b1b" stroke-width="3"/>
    <rect x="140" y="320" width="18" height="14" fill="#2f2f2f" stroke="#1c1b1b" stroke-width="3"/>
    <rect x="184" y="306" width="10" height="10" fill="#ffd700" stroke="#1c1b1b" stroke-width="3"/>
  </g>
  <text x="14" y="34" font-family="monospace, sans-serif" font-size="30" font-weight="bold" fill="#e62429">MCS</text>
  <text x="14" y="58" font-family="monospace, sans-serif" font-size="12" font-weight="bold" fill="#1c1b1b">MINECOUNTER</text>
  <text x="14" y="74" font-family="monospace, sans-serif" font-size="12" font-weight="bold" fill="#1c1b1b">-STRIKE</text>
  <rect x="14" y="88" width="120" height="8" fill="#ffd700"/>
