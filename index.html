    <script>
      // 明暗主题初始化：默认跟随系统 + 手动覆盖（决策记录 #10；design-language.md §2.4）
      ;(function () {
        try {
          var stored = localStorage.getItem('mgaio:theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage 不可用时不阻塞渲染 */
        }
      })()
    </script>
