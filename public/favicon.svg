<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 令牌色：--background #FCF9F8 / --ink #1C1B1B / --shadow-red #BF0016（src/theme/tokens.css） -->
  <rect width="32" height="32" fill="#FCF9F8" />
  <!-- 像素 M（3×5，cell=4，居中）红色硬投影 +2/+2 -->
  <g fill="#BF0016">
    <rect x="12" y="8" width="4" height="20" />
    <rect x="20" y="8" width="4" height="20" />
    <rect x="16" y="12" width="4" height="8" />
  </g>
  <!-- 墨黑 M -->
  <g fill="#1C1B1B">
    <rect x="10" y="6" width="4" height="20" />
    <rect x="18" y="6" width="4" height="20" />
    <rect x="14" y="10" width="4" height="8" />
  </g>
  <!-- 漫画墨线边框 -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#1C1B1B" stroke-width="2" />
</svg>
